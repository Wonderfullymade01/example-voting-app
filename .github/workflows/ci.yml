name: CI

# Run on every push to main, and on pull requests into main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (end-to-end with docker compose)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the whole app and wait until it is healthy
        run: docker compose up -d --build --wait

      - name: Vote page responds
        run: curl -fsS http://localhost:8080 > /dev/null

      - name: Result page responds
        run: curl -fsS http://localhost:8081 > /dev/null

      - name: A vote travels vote -> redis -> worker -> postgres
        run: |
          curl -fsS -X POST --data "vote=a" http://localhost:8080 > /dev/null
          for i in $(seq 1 20); do
            count=$(docker compose exec -T db psql -U postgres -tAc "SELECT COUNT(*) FROM votes" 2>/dev/null || echo 0)
            if [ "$count" -ge 1 ]; then
              echo "Vote reached the database (count=$count)"
              exit 0
            fi
            sleep 2
          done
          echo "Vote never reached the database"
          exit 1

      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs

      - name: Stop the app
        if: always()
        run: docker compose down -v

  build-scan-push:
    name: Build, scan and push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest

    # GITHUB_TOKEN may read the code and write packages (push to GHCR), nothing else
    permissions:
      contents: read
      packages: write

    # Run this job three times in parallel, once per service
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]

    env:
      IMAGE: ghcr.io/wonderfullymade01/${{ matrix.service }}:${{ github.sha }}

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (kept locally, not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}

      - name: Scan the image with Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image to GHCR
        if: github.event_name == 'push'
        run: docker push ${{ env.IMAGE }}

