# Worker: takes votes off the Redis queue and writes them into Postgres
# No Service: it doesn't listen on a port, nothing connects to it
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # Run as the non-root "app" user baked into the image in step 2 (uid 1654)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
      containers:
        - name: worker
          image: "{{ .Values.image.registry }}/worker:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
